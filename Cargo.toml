[workspace]
resolver = "2"
members = ["crates/slint-pixel", "crates/slint-pixel-demo"]
# cargo run / cargo test 默认操作演示窗口
default-members = ["crates/slint-pixel-demo"]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/gqf2008/slint-pixel"
homepage = "https://github.com/gqf2008/slint-pixel"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "deny"
